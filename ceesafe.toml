[package]
name = "httpserver"
version = "0.2.0"
kind = "library"
sources = ["src"]
tests = ["tests"]
ceesafec = ">=0.84.1"        # ADR 0193: a sliced request's bound counts the time it ran; ADR 0191: a paused request no longer holds back the tasks woken behind it, nor a busy worker its heartbeat; ADR 0189: `Async.runSlice` and ADR 0186: `Async.runBound`, which `App.run` sets; ADR 0175: isolated tasks (`App.run`); ADR 0173: `Process.spawnWith` for the supervisor; ADR 0170: a request's budget

