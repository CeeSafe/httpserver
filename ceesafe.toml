[package]
name = "httpserver"
version = "0.2.0"
kind = "library"
sources = ["src"]
tests = ["tests"]
ceesafec = ">=0.91.0"        # ADR 0204: an async function's locals are not zeroed at every resume; ADR 0203: readiness ends a slice, so a request beside one that computes waits a fraction of a ms; ADR 0193: a sliced request's bound counts the time it ran; ADR 0191: a paused request no longer holds back the tasks woken behind it, nor a busy worker its heartbeat; ADR 0189: `Async.runSlice` and ADR 0186: `Async.runBound`, which `App.run` sets; ADR 0175: isolated tasks (`App.run`); ADR 0173: `Process.spawnWith` for the supervisor; ADR 0170: a request's budget

[dependencies]
web_core = { git = "https://github.com/CeeSafe/CeeSafe.Web.git", rev = "bbf01c4109c32f1bfd965de9cc82d7c3f2c3c345", dir = "packages/web_core" }
web_transport = { git = "https://github.com/CeeSafe/CeeSafe.Web.git", rev = "bbf01c4109c32f1bfd965de9cc82d7c3f2c3c345", dir = "packages/web_transport" }
web_http = { git = "https://github.com/CeeSafe/CeeSafe.Web.git", rev = "bbf01c4109c32f1bfd965de9cc82d7c3f2c3c345", dir = "packages/web_http" }
web_http1 = { git = "https://github.com/CeeSafe/CeeSafe.Web.git", rev = "bbf01c4109c32f1bfd965de9cc82d7c3f2c3c345", dir = "packages/web_http1" }
web_http2 = { git = "https://github.com/CeeSafe/CeeSafe.Web.git", rev = "bbf01c4109c32f1bfd965de9cc82d7c3f2c3c345", dir = "packages/web_http2" }
